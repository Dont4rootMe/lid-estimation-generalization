  derivative_backend: active_exact
nf:
  field_preconditioning: covariance_span_v1
  max_condition_frequency: 1.0
  noise_pairing: iid
  terminal_decay_steps: 8000
  terminal_learning_rate_ratio: 0.01
  ema_decay: 0.999
  training_loss: unchanged conditional Gaussian-smoothed NLL
  primary_readout: source OLS5
  derivative_validity_check: float64 exact log-scale derivative and heat identity
selection:
  checkpoint: native holdout loss; fixed validation noise; raw or terminal EMA
  scale: unchanged source-train holdout supervised bounded-v2 MAE
  full_support_v1: diagnostic only; may prefer global crossings
  test: only after the scale receipt is written
  boundary: scale_unresolved, not a converged local estimate
experimental_extensions:
  empirical_posterior_v1: optional target-variance ablation; full optimizer-fit empirical
    prior, additional float64 compute; not the default recipe
  data_v1: alternative residual scaling, not adopted
  gaussian_tail_v1: corrects the large-noise residual trace order; tested separately
    on Exp and Spaghetti, not adopted as the common recipe
  width_736: capacity control, not adopted
