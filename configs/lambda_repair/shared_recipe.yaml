schema_version: 1
base_revision: 6d041365b9bc27de5054293be6c1318766ddf911
status: implemented; representative outlier validation, not a complete campaign
normalization: unchanged source optimizer-fit mean and ambient RMS
vector:
  field_preconditioning: covariance_span_v1
  field_backbone: spectral_residual_v1
  field_residual_scaling: noise_v1
  field_residual_width: 512
  noise_pairing: antithetic_v1
  training_target: sample_v1
  terminal_decay_steps: 8000
  terminal_learning_rate_ratio: 0.01
  ema_decay: 0.999
