defaults:
  - pilot_model: diffusion
  - _self_

schema_version: 1
project: lid-generalization
experiment_name: ${pilot_model.experiment_name}
seed: 137
output_root: artifacts/pilot

data:
  root: data/lid_benchmarks_exact/benchmarks
  registry: configs/datasets/registry/paper_benchmarks.yaml
  representation: dataset
  mmap_mode: r
  names:
    - e8_gaussian4_pca
    - e8_spaghetti_pca
    - e8_sphere4_pca

evaluation:
  batch_size: 128
  divergence_backend: ${pilot_model.derivative_backend}
  trace_probes: ${pilot_model.trace_probes}
  trace_seed: ${seed}
  selection:
    source_split: train
    subset_size: 1000
    seed: ${seed}
    criterion: mae
    tie_tolerance: 1.0e-12
    tie_break: ${pilot_model.selection_prefer}

logging:
  backend: comet
  project: ${project}
  experiment_name: ${experiment_name}
  workspace: dont4rootme

hydra:
  job:
    name: ${experiment_name}
    chdir: false
  run:
    dir: artifacts/hydra/pilot/${pilot_model.family}/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  output_subdir: .hydra
