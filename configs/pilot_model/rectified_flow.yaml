name: rectified_flow
family: rectified_flow
experiment_name: lid-generalization-e8-suite-rectified-flow-matching-train-mae-time-selection-seed-${seed}
readout: full
selection_prefer: larger
derivative_backend: hutchinson
trace_probes: 16

training:
  seed: ${seed}
  device: cuda
  epochs: 200
  batch_size: 512
  learning_rate: 0.0002
  weight_decay: 0.000001
  hidden_dim: 1024
  depth: 6
  time_embedding_dim: 128
  validation_interval: 1
  early_stopping_patience: 20
  gradient_clip_norm: 1.0
  num_workers: 4
  deterministic: true
  time_min: 0.001
  time_max: 0.999
  fourier_features: 32
  max_condition_frequency: 100.0
  dropout: 0.0
  normalize: true
  normalization_epsilon: 1.0e-8

scales:
  - 0.5
  - 0.6666667
  - 0.8
  - 0.8888889
  - 0.9411765
  - 0.969697
  - 0.9846154
  - 0.9922481
  - 0.9961089
