schema_version: 7
id: full_ambient_shared_stock8_retained_nf_v7
scope: all 39 campaign representations and 13 native interfaces
architecture_rule: full supplied coordinates or full images; no fitted support projection
vector_data:
  preconditioning: ambient_isotropic_v1
  backbone: spectral_residual_v1
  width: 512
  residual_scaling: noise_v1
image_data:
  preconditioning: image_gaussian_v1
  backbone: image_unet_v1
  width: 8
  residual_scaling: gaussian_tail_v1
nf:
  architecture: invertible RealNVP; spatial U-Net conditioners on images
  capacity_target: actual common vector backbone for coefficients; retained image NF is exempt
  maximum_relative_parameter_gap: 0.1
  width_selection: closest parameter count for vectors; fixed retained width for images
  image_capacity_policy: retained_image_nf_d296210
  image_conditioner_width: 9
  image_coupling_layers: 8
  max_condition_frequency: 1.0
training:
  seed: 0
  steps: 128000
  batch_size: 256
  learning_rate: 0.0002
  weight_decay: 1.0e-06
  gradient_clip_norm: 1.0
  validation_interval_steps: 500
  warmup_steps: 0
  noise_pairing: antithetic_v1
  terminal_decay_steps: 8000
  terminal_learning_rate_ratio: 0.01
  ema_decay: 0.999
  optimizer_schedule_policy: shared_terminal_v1
  precision: float32; TF32 disabled
  native_differences: targets, loss weights and noise/time sampling remain the declared
    method definitions
selection:
  weights: lowest native holdout loss, same raw/EMA candidates and validation intervals
  known_lid_scale: minimum source-train holdout MAE on all 29 half-octaves from 1/256 through 64
  unknown_lid_scale: source-train reference mean Kneedle; freeze and transfer to dependent
    cells
  image_trace_probes: 64
  vector_trace: exact full-ambient Jacobian for every vector interface
  nf_primary: OLS5
  nf_validity: exact log-scale derivative, separately reported
  refinement: none for any model
  test: all original test queries, only after immutable checkpoint/scale receipts
measurement:
  kneed_version: 0.8.6
  known_lid_automatic: primary pointwise Kneedle on the same 29 candidates as supervised selection
  primary_automatic_metric: kneedle_common_grid
  historical_reproduction: legacy pointwise Kneedle on 22 FLIPD VP times, ambient fallback
  candidate_matching: exactly the same fixed 29 scales for all models and both primary selectors
  kneedle_parameters: reference VP time, convex decreasing, S=1, online=false, interp1d
  automatic_coverage: report every fallback and boundary choice; retain all queries in MAE
  unknown_failure: propagate reference failure reason and report missing measurement coverage
  verification: replay selection and all metrics from hashed query-level artifacts
  secondary_readouts: FM and bridge response at the frozen primary scale; no separate tuning
  e1: mean drift on identical test data; retain original source-train sample count
  e5: pointwise transformed-minus-reference MAE against the declared LID delta
  pairing: canonical archive row order, checked query IDs and saved class-label order
  export: separate canonical/generated and supervised/common-Kneedle/historical tracks
  score_coverage: never omit failed cells; zero E1 reference mean has no relative score
  non_gaussian: native response only; no Gaussian full or score conversion
  scale_units: per-coordinate RMS noise; equals beta/alpha for unit-variance Gaussian sources
non_gaussian:
  models: t_flowmatching nu5 and pfgmpp augmented dimension128
  parameters: fixed across datasets; no tail-parameter selection
  kernel: multivariate Student-t with one chi-square denominator per sample
  sampling: native uniform t for t-Flow; truncated EDM lognormal sigma for PFGM++
  loss: native Student noise MSE; native EDM weighted denoising MSE, respectively
  vector_conditioning: all supplied coordinates and native RMS noise; no normal-complement substitution
  backbone: same parameter count and core as Gaussian fields on each dataset
  image_routing: common U-Net with all ambient coordinates retained
budget_interpretation: equal updates and network examples; parameters matched within
  10 percent for NF, measured elapsed time recorded; FLOPs are not claimed equal
old_results: projected runs excluded from paper including ablations; aggregation requires fresh matching protocol receipts
